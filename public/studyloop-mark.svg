  <!-- badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#F9D56E" stroke="#1B1B18" stroke-width="4"/>
  <!-- tilted index card -->
  <g transform="rotate(-8 27 37)">
    <rect x="12" y="27" width="30" height="21" rx="4" fill="#FFFFFF" stroke="#1B1B18" stroke-width="3"/>
    <line x1="18" y1="35" x2="34" y2="35" stroke="#1B1B18" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="18" y1="40" x2="28" y2="40" stroke="#1B1B18" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- repeat loop arrow -->
